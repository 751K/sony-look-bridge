<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Per-pixel colour pipeline in Sony Imaging Edge Edit</title>
  <desc id="desc">Eleven stages in reading order: white-balanced camera RGB input, SSCS, LinearMatrix16, MainGamma, RGB2YCC (parameters blended by the as-shot white balance), AreaComp, ChromaSuppress, YGamma, YCC2RGB, the optional Effect stage, and the sRGB or Adobe RGB output.</desc>
  <defs>
    <marker id="arrow-en" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .node { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1.5; }
      .optional { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .label { fill: #1e3a8a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; font-size: 18px; font-weight: 600; text-anchor: middle; }
      .sub { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; font-size: 14px; font-weight: 400; text-anchor: middle; }
      .edge { stroke: #64748b; stroke-width: 1.6; fill: none; marker-end: url(#arrow-en); }
      .index { fill: #dbeafe; }
      .index-text { fill: #1d4ed8; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; font-weight: 600; text-anchor: middle; }
      .badge { fill: #e2e8f0; }
      .badge-text { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; font-size: 11px; font-weight: 600; letter-spacing: .4px; text-anchor: middle; }
    </style>
  </defs>

  <rect x="40" y="40" width="250" height="136" rx="20" class="node"/>
  <circle cx="66" cy="66" r="13" class="index"/>
  <text x="66" y="70" class="index-text">01</text>
  <text x="165" y="87.5" class="label">White-balanced</text>
  <text x="165" y="112.5" class="label">camera RGB</text>
  <text x="165" y="138.5" class="sub">input</text>

  <line x1="290" y1="108" x2="330" y2="108" class="edge"/>
  <rect x="330" y="40" width="250" height="136" rx="20" class="node"/>
  <circle cx="356" cy="66" r="13" class="index"/>
  <text x="356" y="70" class="index-text">02</text>
  <text x="455" y="100" class="label">SSCS</text>
  <text x="455" y="126" class="sub">highlight chroma</text>

  <line x1="580" y1="108" x2="620" y2="108" class="edge"/>
  <rect x="620" y="40" width="250" height="136" rx="20" class="node"/>
  <circle cx="646" cy="66" r="13" class="index"/>
  <text x="646" y="70" class="index-text">03</text>
  <text x="745" y="100" class="label">LinearMatrix16</text>
  <text x="745" y="126" class="sub">colour matrix by hue</text>

  <line x1="870" y1="108" x2="910" y2="108" class="edge"/>
  <rect x="910" y="40" width="250" height="136" rx="20" class="node"/>
  <circle cx="936" cy="66" r="13" class="index"/>
  <text x="936" y="70" class="index-text">04</text>
  <text x="1035" y="100" class="label">MainGamma</text>
  <text x="1035" y="126" class="sub">tone curve</text>

  <line x1="1035" y1="176" x2="1035" y2="232" class="edge"/>
  <rect x="910" y="232" width="250" height="136" rx="20" class="node"/>
  <circle cx="936" cy="258" r="13" class="index"/>
  <text x="936" y="262" class="index-text">05</text>
  <text x="1035" y="282.5" class="label">RGB2YCC</text>
  <text x="1035" y="308.5" class="sub">hue and saturation</text>
  <text x="1035" y="327.5" class="sub">blended by white balance</text>

  <line x1="910" y1="300" x2="870" y2="300" class="edge"/>
  <rect x="620" y="232" width="250" height="136" rx="20" class="node"/>
  <circle cx="646" cy="258" r="13" class="index"/>
  <text x="646" y="262" class="index-text">06</text>
  <text x="745" y="292" class="label">AreaComp</text>
  <text x="745" y="318" class="sub">near-neutral chroma</text>

  <line x1="620" y1="300" x2="580" y2="300" class="edge"/>
  <rect x="330" y="232" width="250" height="136" rx="20" class="node"/>
  <circle cx="356" cy="258" r="13" class="index"/>
  <text x="356" y="262" class="index-text">07</text>
  <text x="455" y="292" class="label">ChromaSuppress</text>
  <text x="455" y="318" class="sub">shadow and highlight chroma</text>

  <line x1="330" y1="300" x2="290" y2="300" class="edge"/>
  <rect x="40" y="232" width="250" height="136" rx="20" class="node"/>
  <circle cx="66" cy="258" r="13" class="index"/>
  <text x="66" y="262" class="index-text">08</text>
  <text x="165" y="292" class="label">YGamma</text>
  <text x="165" y="318" class="sub">luminance, Fade</text>

  <line x1="165" y1="368" x2="165" y2="424" class="edge"/>
  <rect x="40" y="424" width="250" height="136" rx="20" class="node"/>
  <circle cx="66" cy="450" r="13" class="index"/>
  <text x="66" y="454" class="index-text">09</text>
  <text x="165" y="484" class="label">YCC2RGB</text>
  <text x="165" y="510" class="sub">BT.601 inverse</text>

  <line x1="290" y1="492" x2="330" y2="492" class="edge"/>
  <rect x="330" y="424" width="250" height="136" rx="20" class="optional"/>
  <circle cx="356" cy="450" r="13" class="index"/>
  <text x="356" y="454" class="index-text">10</text>
  <text x="455" y="484" class="label">Effect</text>
  <text x="455" y="510" class="sub">BW / SE only</text>
  <rect x="488" y="439" width="76" height="22" rx="11" class="badge"/>
  <text x="526" y="454" class="badge-text">OPTIONAL</text>

  <line x1="580" y1="492" x2="620" y2="492" class="edge"/>
  <rect x="620" y="424" width="250" height="136" rx="20" class="node"/>
  <circle cx="646" cy="450" r="13" class="index"/>
  <text x="646" y="454" class="index-text">11</text>
  <text x="745" y="484" class="label">sRGB / Adobe RGB</text>
  <text x="745" y="510" class="sub">output</text>
</svg>
